  # 3. Status Quo & Strategic Pillars (3-Card Slide)
  - type: cards
    tracker: "China RIMS Solution Proposal | Background & Objectives"
    action_title: "现状分析：多类退役系统沉淀海量异构数据，亟需统一归档治理"
    lead_note: "历史业务数据是企业核心资产，也是满足监管审计、保障业务连续的关键依据。"
    takeaway: "Phase 1 先完成数据识别与标准归档，为全量统一查询与合规取证构筑坚实底座。"
    cards:
      - title: "存量痛点"
        badge: "01"
        subtitle: "数据孤岛与底层存储局限"
        bullets:
          - "现有本地 Blob 仅做底层文件存储，缺乏标准化归档元数据与全局索引"
          - "历史系统分散在不同机房与云环境，访问接口停运且缺乏统一入口"
          - "数据库版本老旧，长期面临运维安全与补丁合规隐患"
        tags: ["架构分散", "运维风险", "无统一入口"]
        highlight: false

      - title: "资产价值"
        badge: "02"
        subtitle: "企业核心资产沉淀与赋能"
        bullets:
          - "沉淀业务全量历史记录，覆盖客户、订单、费用、追溯与活动数据"
          - "支撑下游经营分析、策略复盘与历史趋势对比"
          - "为未来引入 AI 智能检索与合规辅助挖掘提供高质量语料数据"
        tags: ["数据资产", "商业复盘", "AI准备度"]
        highlight: true

      - title: "合规刚需"
        badge: "03"
        subtitle: "行业强监管与审计举证要求"
        bullets:
          - "药监 NMPA 及行业监管对历史记录与电子签名有严格保留期限要求"
          - "应对突发外部稽核时，需在 2 小时内快速调阅不可篡改原始证据链"
          - "需具备完整的 WORM 防篡改与到期自动销毁合规闭环举证能力"
        tags: ["NMPA合规", "防篡改", "快速举证"]
        highlight: false

