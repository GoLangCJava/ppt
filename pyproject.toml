[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consulting-ppt"
version = "0.1.0"
description = "Generate McKinsey/BCG/BTS-level consulting presentations using python-pptx."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-pptx>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
]

[project.scripts]
ppt-gen = "ppt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
